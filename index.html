<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de impuestos a las actividades economicas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-6">
                <form id="frmCliente">
                    <div class="container text-center">
                        <div class="row">
                            <div class="col">
                                <input pattern="^[0-9]{3,10}$" required placeholder="Codigo" name="txtCodigoCliente"
                                    id="txtCodigoCliente" class="form-control" type="text">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <input pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ ]{3,}$" required placeholder="Nombre"
                                    name="txtNombreCliente" id="txtNombreCliente" class="form-control" type="text">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <input placeholder="Direccion" name="txtDireccionCliente" id="txtDireccionCliente"
                                    class="form-control" type="text">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <input pattern="^[0-9]{4}-[0-9]{4}$" placeholder="Telefono" name="txtTelefonoCliente"
                                    id="txtTelefonoCliente" class="form-control" type="text">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <input placeholder="Email" name="txtEmailCliente" id="txtEmailCliente"
                                    class="form-control" type="email">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <select class="form-control" name="cboTipoPersona" id="cboTipoPersona">
                                    <option value="particular">Particular</option>
                                    <option value="empresa">Empresa</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <input type="submit" value="Guardar" class="btn btn-primary">
                                <input type="button" value="Buscar" class="btn btn-secondary">
                                <input type="reset" value="Limpiar" class="btn btn-warning">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col-6">
                <form id="frmConsultarCliente">
                    <div class="container text-center">
                        <div class="row">
                            <div class="col">BUSQUEDA DE CLIENTES</div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <div class="table-responsive">
                                    <table class="table table-striped table-hover">
                                        <thead>
                                            <tr>
                                                <th colspan="7">
                                                    <input type="search" placeholder="buscar por codigo, nombre"
                                                        id="txtBuscarCliente" name="txtBuscarCliente"
                                                        class="form-control">
                                                </th>
                                            </tr>
                                            <tr>
                                                <th>Codigo</th>
                                                <th>Nombre</th>
                                                <th>Direccion</th>
                                                <th>Telefono</th>
                                                <th>Email</th>
                                                <th>Tipo</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody id="tblClientes"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- ===== ACTIVIDADES ECONOMICAS (solo empresas) ===== -->
        <div class="row mt-4 d-none" id="panelImpuesto">
            <div class="col-6">
                <form id="frmActividad">
                    <div class="container text-center">
                        <div class="row">
                            <div class="col fw-bold">REGISTRO DE PERIODO Y BALANCE</div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <select class="form-control" id="cboEmpresa" required></select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <input pattern="^[0-9]{3,10}$" required placeholder="Codigo de actividad (ej. 11801)"
                                    id="txtCodigoActividad" class="form-control" type="text">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <label class="form-label mb-0">Desde</label>
                                <input required id="txtDesde" class="form-control" type="date">
                            </div>
                            <div class="col">
                                <label class="form-label mb-0">Hasta</label>
                                <input required id="txtHasta" class="form-control" type="date">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <input required placeholder="Balance" id="txtBalance" class="form-control" type="number"
                                    step="0.01" min="0.01">
                            </div>
                            <div class="col">
                                <input readonly placeholder="Impuesto (automatico)" id="txtPrecio" class="form-control"
                                    type="text">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <input type="submit" value="Registrar periodo" class="btn btn-primary">
                                <input type="reset" value="Limpiar" class="btn btn-warning">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col-6">
                <div class="container text-center">
                    <div class="row">
                        <div class="col fw-bold">HISTORIAL DE LA EMPRESA</div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Desde</th>
                                    <th>Hasta</th>
                                    <th>Balance</th>
                                    <th>Codigo</th>
                                    <th>Precio</th>
                                    <th>Estado</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tblActividades"></tbody>
                            <tfoot>
                                <tr class="table-light">
                                    <td colspan="4" class="text-end fw-bold">Total historico (administrativo)</td>
                                    <td colspan="3" class="text-start fw-bold" id="lblTotalHistorico">$0.00</td>
                                </tr>
                                <tr>
                                    <td colspan="7" class="small text-muted">
                                        Suma de las filas mostradas; no es la mensualidad vigente ni se cobra cada mes.
                                    </td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    var accion = 'nuevo',
        idCliente = '';

    frmCliente.addEventListener('submit', (e) => {
        e.preventDefault();
        guardarClientes();

    });
    frmCliente.addEventListener('reset', (e) => {
        e.preventDefault();
        limpiarFormulario();
    });
    txtBuscarCliente.addEventListener('keyup', (e) => {
        e.preventDefault();
        obtenerClientes(txtBuscarCliente.value);
    });
    document.addEventListener("DOMContentLoaded", obtenerClientes);

    async function obtenerClientes(buscar = "") {
        let response = await fetch(`/clientes?buscar=${buscar}`),
            datos = await response.json();
        mostrarDatos(datos);
    }
    function mostrarDatos(datos) {
        let filas = "";
        datos.forEach(e => {
            filas += `
                <tr onClick='modificarCliente(${JSON.stringify(e)}, event)'>
                    <td>${e.codigo}</td>
                    <td>${e.nombre}</td>
                    <td>${e.direccion}</td>
                    <td>${e.telefono}</td>
                    <td>${e.email}</td>
                    <td>${e.tipo}</td>
                    <td>
                        <input onClick='eliminarCliente(${JSON.stringify(e)}, event)' 
                            type="button" value="DEL" class="btn btn-danger"/>
                    </td>
                </tr>
            `;
        });
        tblClientes.innerHTML = filas;
    }
    function modificarCliente(data, event) {
        event.preventDefault();
        idCliente = data.idCliente;
        accion = "modificar";

        txtCodigoCliente.value = data.codigo;
        txtNombreCliente.value = data.nombre;
        txtDireccionCliente.value = data.direccion;
        txtTelefonoCliente.value = data.telefono;
        txtEmailCliente.value = data.email;
        cboTipoPersona.value = data.tipo;
        mostrarPanelImpuesto(data);
    }
    function eliminarCliente(data, event) {
        event.preventDefault();
        if (confirm(`¿Seguro de eliminar al cliente: ${data.nombre}?`)) {
            idCliente = data.idCliente;
            accion = "eliminar";
            guardarClientes();
        }
    }
    async function guardarClientes() {
        let datos = {
            codigo: txtCodigoCliente.value,
            nombre: txtNombreCliente.value,
            direccion: txtDireccionCliente.value,
            telefono: txtTelefonoCliente.value,
            email: txtEmailCliente.value,
            tipo: cboTipoPersona.value,
            accion,
            idCliente
        };
        let response = await fetch('/cliente', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        }), respuesta = await response.json();
        if (respuesta.msg != "ok") {
            alert("Error: " + respuesta.msg);
            return;
        }
        obtenerClientes();
        limpiarFormulario();
        cargarEmpresas();
        panelImpuesto.classList.add('d-none');
    }
    function limpiarFormulario() {
        accion = 'nuevo';
        idCliente = '';
        txtCodigoCliente.value = '';
        txtNombreCliente.value = '';
        txtDireccionCliente.value = '';
        txtTelefonoCliente.value = '';
        txtEmailCliente.value = '';
        cboTipoPersona.value = 'particular';
    }

    /* ===================== ACTIVIDADES ECONOMICAS ===================== */
    const fmt = (n) => '$' + Number(n).toFixed(2);

    frmActividad.addEventListener('submit', (e) => {
        e.preventDefault();
        guardarActividad();
    });
    frmActividad.addEventListener('reset', () => { txtPrecio.value = ''; });
    cboEmpresa.addEventListener('change', () => obtenerActividades(cboEmpresa.value));
    txtBalance.addEventListener('input', calcularPrecio);
    txtDesde.addEventListener('change', calcularPrecio);
    document.addEventListener("DOMContentLoaded", cargarEmpresas);

    async function cargarEmpresas() {
        let response = await fetch('/empresas'), empresas = await response.json();
        let actual = cboEmpresa.value;
        cboEmpresa.innerHTML = empresas.map(e =>
            `<option value="${e.idCliente}">${e.codigo} - ${e.nombre}</option>`).join('');
        if (actual) cboEmpresa.value = actual;
    }
    // Se llama desde modificarCliente: solo las empresas muestran el panel
    async function mostrarPanelImpuesto(cliente) {
        if (cliente.tipo !== 'empresa') {
            panelImpuesto.classList.add('d-none');
            return;
        }
        await cargarEmpresas();
        cboEmpresa.value = cliente.idCliente;
        panelImpuesto.classList.remove('d-none');
        obtenerActividades(cliente.idCliente);
    }
    async function calcularPrecio() {
        if (!txtBalance.value) { txtPrecio.value = ''; return; }
        let response = await fetch(`/calcular?balance=${encodeURIComponent(txtBalance.value)}&desde=${txtDesde.value}`),
            r = await response.json();
        txtPrecio.value = r.msg === 'ok' ? fmt(r.precio) : r.msg;
    }
    async function obtenerActividades(idCliente) {
        let response = await fetch(`/actividades?idCliente=${idCliente}`),
            datos = await response.json();
        const colores = { 'Vigente': 'success', 'Histórico': 'secondary', 'Futuro': 'info' };
        tblActividades.innerHTML = datos.map(a => `
            <tr>
                <td>${a.desde}</td>
                <td>${a.hasta}</td>
                <td>${fmt(a.balance)}</td>
                <td>${a.codigo}</td>
                <td>${fmt(a.precio)}</td>
                <td><span class="badge text-bg-${colores[a.estado]}">${a.estado}</span></td>
                <td><input type="button" value="DEL" class="btn btn-danger btn-sm"
                    onclick="eliminarActividad(${a.idActividad})"></td>
            </tr>`).join('');
        let totalCentavos = datos.reduce((t, a) => t + Math.round(Number(a.precio) * 100), 0);
        lblTotalHistorico.textContent = fmt(totalCentavos / 100);
    }
    async function guardarActividad() {
        let datos = {
            accion: 'nuevo',
            idCliente: cboEmpresa.value,
            codigo: txtCodigoActividad.value,
            desde: txtDesde.value,
            hasta: txtHasta.value,
            balance: txtBalance.value
        };
        let r = await enviarActividad(datos);
        if (r.msg != 'ok') { alert('Error: ' + r.msg); return; }
        frmActividad.reset();
        obtenerActividades(cboEmpresa.value);
    }
    async function eliminarActividad(idActividad) {
        if (!confirm('¿Seguro de eliminar este periodo?')) return;
        let r = await enviarActividad({ accion: 'eliminar', idActividad });
        if (r.msg != 'ok') { alert('Error: ' + r.msg); return; }
        obtenerActividades(cboEmpresa.value);
    }
    async function enviarActividad(datos) {
        let response = await fetch('/actividad', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        });
        return await response.json();
    }
</script>

</html>
